:root{
  color-scheme:dark;
  --ink:#160a23; --text:#f4eef9; --muted:#b8a8cc; --line:rgba(255,255,255,.14); --gold:#f0c46a;
  --display:"Diavlo","Arial Black",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100svh;background:var(--ink);color:var(--text);font:400 1rem/1.5 var(--body);
  background-image:radial-gradient(60rem 28rem at 8% -8%,#37195c 0%,transparent 62%),
                   radial-gradient(44rem 24rem at 100% 108%,#2a1346 0%,transparent 60%)}
:focus-visible{outline:3px solid var(--gold);outline-offset:4px;border-radius:6px}
.page{max-width:1120px;min-height:100vh;min-height:100svh;margin:0 auto;padding:40px 16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center}
.logo{display:block;max-width:min(260px,70vw);max-height:120px;width:auto;height:auto;margin:0 auto 28px}
.wordmark{margin:0 0 28px;font:700 1.4rem var(--display)}
h1{margin:0 0 40px;font:900 clamp(2.6rem,9vw,5rem)/1 var(--display);font-variant-ligatures:none;font-feature-settings:"liga" 0,"clig" 0,"dlig" 0}

.cards{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;list-style:none;margin:0;padding:0}
.card{--c:#fff;display:flex;flex-direction:column;align-items:flex-start;gap:6px;height:100%;min-height:270px;padding:26px 22px 22px;
  text-align:left;text-decoration:none;color:var(--text);background:rgba(255,255,255,.045);border:1px solid var(--line);
  border-top:3px solid var(--c);transition:background .2s,transform .2s,border-color .2s}
.card:hover{background:rgba(255,255,255,.09);border-color:var(--c);transform:translateY(-4px)}
.ig{--c:#ff6fa8} .fb{--c:#78aeff} .yt{--c:#ff6a5e} .tg{--c:#52c7f2}
.ico{width:52px;height:52px;margin-bottom:auto;color:var(--c);fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.name{margin-top:28px;font:900 1.9rem/1.05 var(--display);font-variant-ligatures:none}
.handle{color:var(--muted);font-size:.98rem;overflow-wrap:anywhere}
.cta{margin-top:14px;display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;background:var(--c);
  color:var(--ink);font:700 .95rem var(--body)}
.foot{margin:44px 0 0;color:var(--muted);font-size:.9rem}

@media (max-width:1020px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){
  .cards{grid-template-columns:1fr}
  .card{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center;column-gap:16px;padding:20px}
  .ico{width:44px;height:44px;margin:0}
  .name{margin:0;font-size:1.6rem}
  .handle{flex-basis:100%;order:3}
  .cta{order:4;margin-top:8px}
  h1{margin-bottom:28px}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
